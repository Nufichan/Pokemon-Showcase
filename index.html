<html lang="en">
<head>

<title>Showcase Points Calculator</title>
<style>
  :root{
    --bg-1:#0b1330;
    --bg-2:#2c1657;
    --bg-3:#4a1f6b;
    --card:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.14);
    --text:#f2eefb;
    --text-dim:#d6cfef;
    --gold:#ffcb05;
    --gold-deep:#e0a800;
    --coral:#ff5a6e;
    --teal:#43d9ad;
    --field-bg:rgba(255,255,255,0.08);
    --field-border:rgG-Xba(255,255,255,0.18);
    --radius:16px;
    --font: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  :root[data-theme="light"]{
    --bg-1:#eef1ff; --bg-2:#e3d9ff; --bg-3:#ffe3ef;
    --card:rgba(255,255,255,0.55); --card-border:rgba(60,40,100,0.14);
    --text:#241a3d; --text-dim:#5c5379;
    --field-bg:rgba(255,255,255,0.7); --field-border:rgba(60,40,100,0.18);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-1:#eef1ff; --bg-2:#e3d9ff; --bg-3:#ffe3ef;
      --card:rgba(255,255,255,0.55); --card-border:rgba(60,40,100,0.14);
      --text:#241a3d; --text-dim:#5c5379;
      --field-bg:rgba(255,255,255,0.7); --field-border:rgba(60,40,100,0.18);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(circle at 15% 8%, rgba(255,203,5,0.16), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(67,217,173,0.14), transparent 45%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    display:flex;
    justify-content:center;
    padding:40px 16px 64px;
  }
  .wrap{width:100%; max-width:480px;}
  header{text-align:center; margin-bottom:28px;}
  .logo-word{display:flex; align-items:baseline; justify-content:center; gap:6px; margin-bottom:10px;}
  .logo-img{
    max-height:64px; max-width:80%; margin:0 auto 10px; display:block;
  }
  h1{font-size:1.05rem; font-weight:600; margin:0 0 4px; color:var(--text);}
  .tagline{color:var(--text-dim); font-size:0.85rem; margin:0;}

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:24px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .field{margin-bottom:18px;}
  .autocomplete-wrap{position:relative;}
  .suggestions{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
    max-height:220px; overflow-y:auto;
    background:var(--bg-2); border:1px solid var(--field-border); border-radius:10px;
    box-shadow:0 14px 30px rgba(0,0,0,0.35);
    display:none;
  }
  .suggestions.show{display:block;}
  .suggestions .opt{
    padding:9px 13px; font-size:0.9rem; color:var(--text); cursor:pointer;
  }
  .suggestions .opt:hover, .suggestions .opt.active{background:rgba(255,203,5,0.16);}
  .suggestions .none{padding:9px 13px; font-size:0.85rem; color:var(--text-dim);}
  .field label{
    display:block; font-size:0.78rem; font-weight:600; letter-spacing:0.02em;
    color:var(--text-dim); margin-bottom:7px;
  }
  .input-base{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1px solid var(--field-border); background:var(--field-bg);
    color:var(--text); font-family:var(--font); font-size:0.95rem;
    outline:none; transition:border-color .15s, background .15s;
  }
  .input-base:focus{border-color:var(--gold); background:rgba(255,255,255,0.12);}
  .input-base::placeholder{color:var(--text-dim); opacity:0.85;}
  :root[data-theme="light"] .input-base:focus, @media (prefers-color-scheme:light){.input-base:focus{background:rgba(255,255,255,0.9);}}
  select.input-base{ -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .hint{font-size:0.72rem; color:var(--text-dim); margin-top:5px;}

  .btn{
    width:100%; padding:13px; margin-top:6px; border:none; border-radius:10px;
    background:linear-gradient(90deg, var(--gold), var(--gold-deep));
    color:#231600; font-weight:700; font-size:0.95rem; letter-spacing:0.02em;
    cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(255,203,5,0.3);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none;}

  .result{
    margin-top:22px; padding-top:20px; border-top:1px solid var(--card-border);
    text-align:center; display:none;
  }
  .result.show{display:block; animation:reveal .35s ease;}
  @keyframes reveal{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .result .score{
    font-size:2.6rem; font-weight:700; line-height:1;
    background:linear-gradient(90deg, var(--gold), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .result .score-label{font-size:0.78rem; color:var(--text-dim); margin-top:4px;}
  .breakdown{
    margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px;
    text-align:left;
  }
  .breakdown div{
    background:var(--field-bg); border:1px solid var(--field-border);
    border-radius:8px; padding:8px 10px;
  }
  .breakdown .k{font-size:0.68rem; color:var(--text-dim); display:block; margin-bottom:2px;}
  .breakdown .v{font-size:0.88rem; font-weight:600;}
  .xxl-badge{
    display:inline-block; margin-top:10px; padding:3px 10px; border-radius:100px;
    background:rgba(255,90,110,0.18); color:var(--coral); font-size:0.72rem; font-weight:700;
    border:1px solid rgba(255,90,110,0.35);
  }
  .error{
    margin-top:14px; font-size:0.82rem; color:var(--coral); text-align:center; display:none;
  }
  .error.show{display:block;}
  footer{text-align:center; margin-top:20px; color:var(--text-dim); font-size:0.7rem;}
  .socials{display:flex; justify-content:center; gap:16px; margin-top:28px;}
  .social{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--card-border);
    transition:transform .15s ease, border-color .15s ease;
  }
  .social svg{width:19px; height:19px; fill:#000;}
  .social:hover{transform:translateY(-2px); border-color:var(--gold);}
</style>

<body>
<div class="wrap">
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Pok%C3%A9mon_GO_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Pokémon GO logo" class="logo-img">
    <h1>Showcase Points Calculator</h1>
    <p class="tagline">Enter a Pokémon's stats to estimate its Showcase score</p>
  </header>

  <div class="card">
    <div class="field autocomplete-wrap">
      <label for="species">Pokémon</label>
      <input class="input-base" id="species" autocomplete="off" placeholder="Type to search…">
      <div class="suggestions" id="suggestions"></div>
    </div>

    <div class="field row2">
      <div>
        <label for="weight">Weight (kg)</label>
        <input class="input-base" id="weight" type="number" step="0.01" min="0" placeholder="e.g. 420.69">
      </div>
      <div>
        <label for="height">Height (m)</label>
        <input class="input-base" id="height" type="number" step="0.01" min="0" placeholder="e.g. 6.7">
      </div>
    </div>

    <div class="field row3">
      <div>
        <label for="ivatk">ATK IV</label>
        <input class="input-base" id="ivatk" type="number" min="0" max="15" list="iv-list" placeholder="0–15">
      </div>
      <div>
        <label for="ivdef">DEF IV</label>
        <input class="input-base" id="ivdef" type="number" min="0" max="15" list="iv-list" placeholder="0–15">
      </div>
      <div>
        <label for="ivsta">HP IV</label>
        <input class="input-base" id="ivsta" type="number" min="0" max="15" list="iv-list" placeholder="0–15">
      </div>
    </div>
    <datalist id="iv-list">
      <option value="0"><option value="1"><option value="2"><option value="3">
      <option value="4"><option value="5"><option value="6"><option value="7">
      <option value="8"><option value="9"><option value="10"><option value="11">
      <option value="12"><option value="13"><option value="14"><option value="15">
    </datalist>

    <div class="field">
      <label for="size">Size (Height Group)</label>
      <select class="input-base" id="size">
        <option value="XXS">XXS</option>
        <option value="XS">XS</option>
        <option value="-" selected>— (Average)</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
      </select>
      <p class="hint">Only XXL changes the score — it adds a fixed bonus.</p>
    </div>

    <button class="btn" id="calc">Calculate score</button>

    <p class="error" id="error"></p>

    <div class="result" id="result">
      <div class="score" id="score">0</div>
      <div class="score-label">Showcase Points</div>
      <div id="xxlbadge"></div>
      <div class="breakdown">
        <div><span class="k">IV contribution</span><span class="v" id="b-iv">–</span></div>
        <div><span class="k">Height contribution</span><span class="v" id="b-h">–</span></div>
        <div><span class="k">Weight contribution</span><span class="v" id="b-w">–</span></div>
        <div><span class="k">XXL bonus</span><span class="v" id="b-xxl">–</span></div>
      </div>
    </div>
  </div>

  const DB = {};
  RAW.trim().split("\n").forEach(line=>{
    const p = line.split("|");
    DB[p[0].toLowerCase()] = { name:p[0], h:parseFloat(p[1]), w:parseFloat(p[2]), mhg:parseFloat(p[3]), wdev:parseFloat(p[4]) };
  });

  const NAMES = Object.values(DB).sort((a,b)=>a.name.localeCompare(b.name));

  const $ = id => document.getElementById(id);
  const speciesInput = $('species');
  const suggestBox = $('suggestions');

  function renderSuggestions(query){
    const q = query.trim().toLowerCase();
    if(!q){ suggestBox.classList.remove('show'); suggestBox.innerHTML=''; return; }
    const matches = NAMES.filter(e => e.name.toLowerCase().startsWith(q));
    if(matches.length === 0){
      suggestBox.innerHTML = '<div class="none">No matches</div>';
    } else {
      suggestBox.innerHTML = matches.map(e => `<div class="opt" data-name="${e.name}">${e.name}</div>`).join('');
    }
    suggestBox.classList.add('show');
  }

  speciesInput.addEventListener('input', () => renderSuggestions(speciesInput.value));
  speciesInput.addEventListener('focus', () => renderSuggestions(speciesInput.value));

  suggestBox.addEventListener('mousedown', (e) => {
    const opt = e.target.closest('.opt');
    if(!opt) return;
    speciesInput.value = opt.dataset.name;
    suggestBox.classList.remove('show');
    suggestBox.innerHTML = '';
  });

  document.addEventListener('click', (e) => {
    if(e.target !== speciesInput && !suggestBox.contains(e.target)){
      suggestBox.classList.remove('show');
    }
  });
  const errorEl = $('error');
  const resultEl = $('result');

  function showError(msg){
    errorEl.textContent = msg;
    errorEl.classList.add('show');
    resultEl.classList.remove('show');
  }
  function clearError(){
    errorEl.classList.remove('show');
  }

  $('calc').addEventListener('click', () => {
    clearError();
    const speciesInput = $('species').value.trim();
    const entry = DB[speciesInput.toLowerCase()];
    if(!entry){
      showError('Pick a Pokémon from the list to continue.');
      return;
    }
    const H = parseFloat($('height').value);
    const W = parseFloat($('weight').value);
    const ivAtk = parseFloat($('ivatk').value);
    const ivDef = parseFloat($('ivdef').value);
    const ivSta = parseFloat($('ivsta').value);
    if([H,W,ivAtk,ivDef,ivSta].some(v => isNaN(v))){
      showError('Fill in height, weight, and all three IVs.');
      return;
    }
    if(ivAtk<0||ivAtk>15||ivDef<0||ivDef>15||ivSta<0||ivSta>15){
      showError('IVs must be between 0 and 15.');
      return;
    }
    const size = $('size').value;
    const isXXL = size === 'XXL';

    const ivSum = ivAtk + ivDef + ivSta;
    const ivPart = 50 * (ivSum/45);
    const hPart = 800 * (H / (entry.h * entry.mhg));
    const wPart = 150 * (W / (entry.w * entry.mhg + 4 * entry.wdev));
    const xxlPart = isXXL ? 7300/41 : 0;
    const total = ivPart + hPart + wPart + xxlPart;

    $('score').textContent = total.toFixed(2);
    $('b-iv').textContent = ivPart.toFixed(2);
    $('b-h').textContent = hPart.toFixed(2);
    $('b-w').textContent = wPart.toFixed(2);
    $('b-xxl').textContent = xxlPart.toFixed(2);
    $('xxlbadge').innerHTML = isXXL ? '<span class="xxl-badge">XXL bonus applied</span>' : '';
    resultEl.classList.add('show');
  });
</script>
